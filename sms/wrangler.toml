name = "hagah-sms"
main = "worker.js"
compatibility_date = "2026-10-01"

# Hourly Hagah. Runs every hour on the hour; the worker only texts between 8 AM and 7 PM Eastern, so daylight time is handled.
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "HAGAH"
id = "REPLACE_WITH_KV_ID"

# Secrets are set with `wrangler secret put`, never committed:
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM (+1...), ALLOWED_NUMBERS (+1..., comma-separated), PUBLIC_URL (this worker's URL)
